name: lean-formal-carry
on:
  push:
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          test: false
          build-args: "--wfail"
      - name: Check no admitted proofs
        run: |
          if grep -nE '\\b(sorry|admit|native_decide|unsafe axiom)\\b' CollatzPrimes.lean; then
            echo "Admitted proof marker found"; exit 1
          fi
