name: lean-formal-carry
on:
  push:
  pull_request:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Lean toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned Mathlib and fetch cache
        run: |
          lean --version
          lake --version
          lake update
          lake exe cache get
      - name: Compile checked-in Lean theorems
        run: lake build --wfail
      - name: Check no admitted proof markers
        run: |
          if grep -nE '\\b(sorry|admit|native_decide)\\b' CollatzPrimes.lean; then
            echo "Admitted proof marker found"; exit 1
          fi
