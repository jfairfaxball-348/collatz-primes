name: finite-sanity-checks
on:
  push:
  pull_request:
jobs:
  unit-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Finite parity and orbit sanity
        run: |
          python tools/trajectory.py --limit 10000 --depth 8 > /tmp/collatz_audit.json
          cmp validation/S000_audit.json /tmp/collatz_audit.json
          sha256sum validation/S000_audit.json
      - name: Recreate finite residue stream and cross-check original manifest
        run: |
          python tools/residue_certificates.py --output /tmp/S002_manifest.json --records /tmp/S002_records.jsonl
          cmp validation/S001_manifest.json /tmp/S002_manifest.json
          python tools/check_residue_certificates.py /tmp/S002_manifest.json
          python tools/consume_residue_records.py /tmp/S002_manifest.json /tmp/S002_records.jsonl
          sha256sum /tmp/S002_manifest.json /tmp/S002_records.jsonl
